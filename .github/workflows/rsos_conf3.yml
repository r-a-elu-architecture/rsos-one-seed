# CONF3 (real/PREREG_CONF3.md, real/SEAL_CONF3.txt): independent higher-powered confirmation + composed arm. Results to cloud-results/conf3/<run id>/.
name: rsos-conf3
on:
  push:
    branches: [core-v1]
    paths: ["cloud/trigger_conf3.txt"]
permissions:
  contents: write
jobs:

# CONF1 FIX1 (real/PREREG_CONF1_FIX1.md): satellite and inventory cells 501-512 one per job on the frozen orbit file; AI-human 537-538 re-run (25 Nov 2026; real/PREREG_CONF1.md). Results to cloud-results/conf1/<run id>/.
name: rsos-conf1-fix1
on:
  push:
    branches: [core-v1]
    paths: ["cloud/trigger_conf1_fix1.txt"]
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        u: ["space - 501 501",
            "space - 502 502",
            "space - 503 503",
            "space - 504 504",
            "space - 505 505",
            "space - 506 506",
            "space - 507 507",
            "space - 508 508",
            "space - 509 509",
            "space - 510 510",
            "space - 511 511",
            "space - 512 512",
            "economics - 501 501",
            "economics - 502 502",
            "economics - 503 503",
            "economics - 504 504",
            "economics - 505 505",
            "economics - 506 506",
            "economics - 507 507",
            "economics - 508 508",
            "economics - 509 509",
            "economics - 510 510",
            "economics - 511 511",
            "economics - 512 512",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 537 538"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy scipy pandas scikit-learn requests qiskit qiskit-aer pvlib gymnasium skyfield dandi pynwb tiktoken mistral-common && pip install --no-deps llama-models
      - name: OpenRouter credit check (AI rows; prints usage and limit only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -- ${{ matrix.u }}
          case "$1" in ai_*)
            python - <<'EOF'
          import os, json, sys, urllib.request
          r = urllib.request.Request("https://openrouter.ai/api/v1/key", headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]})
          d = json.load(urllib.request.urlopen(r, timeout=30)).get("data", {})
          print("OPENROUTER usage", d.get("usage"), "limit", d.get("limit"), "remaining", d.get("limit_remaining"))
          rem = d.get("limit_remaining")
          if rem is not None and rem < 1.0: sys.exit("STOP: less than $1 OpenRouter credit left")
          EOF
            ;; esac
      - name: real data for this row
        run: |
          set -- ${{ matrix.u }}
          if [ "$1" = space ]; then cp real/hosts/data/space_tle_frozen.txt real/hosts/data/space_tle.txt; fi
          if [ "$1" = ai_human ]; then python real/hosts/ai_human_fetch.py; fi
      - name: FIX1 seal check
        run: grep -v '^#' real/SEAL_CONF1_FIX1.txt | sha256sum -c --quiet
      - run: python cloud/conf1_unit.py ${{ matrix.u }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REASONING_EFFORT: low
          CONF1_GENERATED: ${{ startsWith(matrix.u, 'ai_') && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conf1-${{ strategy.job-index }}
          path: real/outc1/
  collect:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/art
      - run: |
          git config user.name "rsos-cloud"; git config user.email "rsos-cloud@users.noreply.github.com"
          git fetch origin cloud-results && git checkout cloud-results
          mkdir -p conf1/${{ github.run_id }} && cp /tmp/art/*/*.json conf1/${{ github.run_id }}/ 2>/dev/null || true
          git add conf1 && git commit -qm "CONF1 ${{ github.run_id }}" && (git push -q origin cloud-results || (git pull -q --rebase origin cloud-results && git push -q origin cloud-results))

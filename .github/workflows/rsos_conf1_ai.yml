# CONF1 AI rows, 4 cells per job, with the generated arm (seals A and B) (25 Nov 2026; real/PREREG_CONF1.md). Results to cloud-results/conf1/<run id>/.
name: rsos-conf1-ai
on:
  push:
    branches: [core-v1]
    paths: ["cloud/trigger_conf1_ai.txt"]
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        u: ["ai_agents openrouter:openai/gpt-oss-20b 501 504",
            "ai_agents openrouter:openai/gpt-oss-20b 505 508",
            "ai_agents openrouter:openai/gpt-oss-20b 509 512",
            "ai_agents openrouter:openai/gpt-oss-20b 513 516",
            "ai_agents openrouter:openai/gpt-oss-20b 517 520",
            "ai_agents openrouter:openai/gpt-oss-20b 521 524",
            "ai_agents openrouter:openai/gpt-oss-20b 525 528",
            "ai_agents openrouter:openai/gpt-oss-20b 529 532",
            "ai_agents openrouter:openai/gpt-oss-20b 533 536",
            "ai_agents openrouter:openai/gpt-oss-20b 537 540",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 501 504",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 505 508",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 509 512",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 513 516",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 517 520",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 521 524",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 525 528",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 529 532",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 533 536",
            "ai_human openrouter:mistralai/mistral-small-3.2-24b-instruct 537 540"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy scipy pandas scikit-learn requests qiskit qiskit-aer pvlib gymnasium skyfield dandi pynwb tiktoken mistral-common && pip install --no-deps llama-models
      - name: OpenRouter credit check (AI rows; prints usage and limit only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -- ${{ matrix.u }}
          case "$1" in ai_*)
            python - <<'EOF'
          import os, json, sys, urllib.request
          r = urllib.request.Request("https://openrouter.ai/api/v1/key", headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]})
          d = json.load(urllib.request.urlopen(r, timeout=30)).get("data", {})
          print("OPENROUTER usage", d.get("usage"), "limit", d.get("limit"), "remaining", d.get("limit_remaining"))
          rem = d.get("limit_remaining")
          if rem is not None and rem < 1.0: sys.exit("STOP: less than $1 OpenRouter credit left")
          EOF
            ;; esac
      - name: real data for this row
        run: |
          set -- ${{ matrix.u }}
          if [ "$1" = space ]; then python real/hosts/space_fetch.py; fi
          if [ "$1" = ai_human ]; then python real/hosts/ai_human_fetch.py; fi
      - run: python cloud/conf1_unit.py ${{ matrix.u }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REASONING_EFFORT: low
          CONF1_GENERATED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conf1-${{ strategy.job-index }}
          path: real/outc1/
  collect:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/art
      - run: |
          git config user.name "rsos-cloud"; git config user.email "rsos-cloud@users.noreply.github.com"
          git fetch origin cloud-results && git checkout cloud-results
          mkdir -p conf1/${{ github.run_id }} && cp /tmp/art/*/*.json conf1/${{ github.run_id }}/ 2>/dev/null || true
          git add conf1 && git commit -qm "CONF1 ${{ github.run_id }}" && (git push -q origin cloud-results || (git pull -q --rebase origin cloud-results && git push -q origin cloud-results))

# CONF6 (real/PREREG_CONF6.md, real/SEAL_CONF6.txt): AI-AI whole-system RSOS vs plain rollout. Results to cloud-results/conf6/<run id>/.
name: rsos-conf6
on:
  push:
    branches: [core-v1]
    paths: ["cloud/trigger_conf6.txt"]
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        u: ["openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1401 1410",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1411 1420",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1421 1430",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1431 1440",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1441 1450",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1451 1460",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1461 1470",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1471 1480",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1481 1490",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1491 1500",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1501 1510",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1511 1520",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1521 1530",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1531 1540",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1541 1550",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1551 1560",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1561 1570",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1571 1580",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1581 1590",
            "openrouter:openai/gpt-oss-20b,openrouter:meta-llama/llama-3.1-8b-instruct 1591 1600"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy scipy pandas scikit-learn requests qiskit qiskit-aer pvlib gymnasium skyfield dandi pynwb tiktoken mistral-common && pip install --no-deps llama-models
      - name: OpenRouter credit check (AI rows; prints usage and limit only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -- ${{ matrix.u }}
          case "$1" in ai_*|openrouter*)
            python - <<'EOF'
          import os, json, sys, urllib.request
          r = urllib.request.Request("https://openrouter.ai/api/v1/key", headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]})
          d = json.load(urllib.request.urlopen(r, timeout=30)).get("data", {})
          print("OPENROUTER usage", d.get("usage"), "limit", d.get("limit"), "remaining", d.get("limit_remaining"))
          rem = d.get("limit_remaining")
          if rem is not None and rem < 1.0: sys.exit("STOP: less than $1 OpenRouter credit left")
          EOF
            ;; esac
      - name: real data for this row
        run: |
          set -- ${{ matrix.u }}
          if [ "$1" = space ]; then cp real/hosts/data/space_tle_frozen.txt real/hosts/data/space_tle.txt; fi
          if [ "$1" = ai_human ]; then python real/hosts/ai_human_fetch.py; fi
      - name: CONF6 seal check
        run: grep -v '^#' real/SEAL_CONF6.txt | sha256sum -c --quiet
      - run: python cloud/conf6_unit.py ${{ matrix.u }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REASONING_EFFORT: low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conf6-${{ strategy.job-index }}
          path: real/outc6/
  collect:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/art
      - run: |
          git config user.name "rsos-cloud"; git config user.email "rsos-cloud@users.noreply.github.com"
          git fetch origin cloud-results && git checkout cloud-results
          mkdir -p conf6/${{ github.run_id }} && cp /tmp/art/*/*.json conf6/${{ github.run_id }}/ 2>/dev/null || true
          git add conf6 && git commit -qm "CONF6 ${{ github.run_id }}" && (git push -q origin cloud-results || (git pull -q --rebase origin cloud-results && git push -q origin cloud-results))
